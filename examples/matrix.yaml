# Adapt the display platform and pins to your hardware.
esphome:
  name: marquee-example
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(scroll_text).set_text("Hello from ESPHome!", id(message_font));

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

font:
  - file: "gfonts://Roboto Condensed"
    id: message_font
    size: 14
    bpp: 4

external_components:
  - source: github://adipierro/esphome-marquee@main
    components: [marquee]

marquee:
  id: scroll_text
  pixels_per_frame: 1
  on_finished:
    then:
      - display.page.show: next_page

i2c:
  sda: GPIO21
  scl: GPIO22

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    id: matrix
    update_interval: 40ms  # About 25 pixels per second at one pixel per frame.
    pages:
      - id: marquee_page
        lambda: |-
          id(scroll_text).draw(it, 8, Color(255, 255, 255));
          const int progress_width = static_cast<int>(it.get_width() * id(scroll_text).progress());
          if (progress_width > 0)
            it.filled_rectangle(0, it.get_height() - 2, progress_width, 2, Color(255, 255, 255));
      - id: next_page
        lambda: |-
          it.print(0, 8, id(message_font), "Done!");
